<!DOCTYPE html>
<html>
<head>
    <title>Sweet Treats Bakery</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav>
        <h2>Sweet Treats Bakery</h2>

        <a href="index.html">Home</a>
        <a href="products.html">Products</a>
    </nav>

    <section class="home">
        <h1>Welcome to Sweet Treats !</h1>

        <p>Freshly baked happiness in every bite.</p>

        <a href="products.html" class="btn">View Products</a>

        <h2>Feedback Form</h2>

<form id="feedbackForm">
    <input type="text" id="name" placeholder="Enter Name" required><br><br>

    <input type="email" id="email" placeholder="Enter Email" required><br><br>

    <input type="number" id="rating" placeholder="Rating (1-5)" min="1" max="5" required><br><br>

    <input type="text" id="subject" placeholder="Enter Subject" required><br><br>

    <textarea id="feedback" placeholder="Enter Feedback" required></textarea><br><br>

    <button type="submit">Submit Feedback</button>
</form>

<p id="message"></p>
    </section>

    <section>
        <h2>About Our Bakery</h2>

        <p>
            We offer delicious cakes, pastries and cookies
            made with love and fresh ingredients.
        </p>
    </section>

    <footer>
        <p>© 2026 Sweet Treats Bakery</p>
    </footer>

    <script>
document.getElementById("feedbackForm").addEventListener("submit", function(e) {
    e.preventDefault();

    var data = {
        name: document.getElementById("name").value,
        email: document.getElementById("email").value,
        rating: document.getElementById("rating").value,
        subject: document.getElementById("subject").value,
        feedback: document.getElementById("feedback").value
    };

    fetch("YOUR_WEB_APP_URL", {
        method: "POST",
        body: JSON.stringify(data)
    })
    .then(response => response.text())
    .then(result => {
        document.getElementById("message").innerHTML = "Feedback submitted successfully!";
        document.getElementById("feedbackForm").reset();
    })
    .catch(error => {
        document.getElementById("message").innerHTML = "Error submitting feedback!";
    });
});
</script>

</body>
</html>
